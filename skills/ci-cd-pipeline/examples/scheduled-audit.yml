# Scheduled audit pattern (SKILL.md §"Audit wiring B" — scheduled-issue-tracking).
#
# Triggers on cron, scans the whole codebase / lockfile / image, and idempotently
# manages ONE GitHub issue per audit category:
#
#   findings exist  → open or update labelled issue
#   findings clear  → close the issue
#
# The job ALWAYS exits 0. The issue is the signal, not the job status.
# (Failing scheduled jobs creates noise without an actionable PR. Issues are
# actionable and form a live audit dashboard via the `audit` label.)
#
# This file shows osv-scanner (multi-ecosystem). Swap in trivy, syft,
# license-checker, jscpd, etc. for other audit categories — the lifecycle
# logic below is language- and tool-agnostic.
#
# Replace every `<sha>` with a 40-char commit SHA before use.

name: audit-deps-weekly

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  AUDIT_TITLE: "Audit: dependency vulnerabilities"
  AUDIT_CATEGORY: dependency-vulns

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha>

      # ── Replace this step with your scanner of choice. ─────────────────────
      # Output `findings.txt` (non-empty → findings; empty → clean).
      # The lifecycle logic after this step doesn't care which tool produced it.
      - name: Run scanner
        id: scan
        run: |
          set +e
          osv-scanner --format=table --output=findings.txt --recursive ./
          set -e
          if [ -s findings.txt ] && grep -q . findings.txt; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
      # ───────────────────────────────────────────────────────────────────────

      - name: Open or update audit issue
        if: steps.scan.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          body=$(cat <<EOF
          ## Findings as of $(date -u +%Y-%m-%d)

          \`\`\`
          $(cat findings.txt)
          \`\`\`

          *Auto-generated by \`${{ github.workflow }}\`. Will close automatically when resolved.*
          *Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*
          EOF
          )
          existing=$(gh issue list \
            --label "audit" \
            --label "$AUDIT_CATEGORY" \
            --state open \
            --search "$AUDIT_TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create \
              --title "$AUDIT_TITLE" \
              --label "audit" \
              --label "automated" \
              --label "$AUDIT_CATEGORY" \
              --body "$body"
          fi

      - name: Close audit issue if no findings
        if: steps.scan.outputs.has_findings == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          existing=$(gh issue list \
            --label "audit" \
            --label "$AUDIT_CATEGORY" \
            --state open \
            --search "$AUDIT_TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "No findings on $(date -u +%Y-%m-%d). Closing."
            echo "Closed issue #$existing"
          fi

      # Job ALWAYS exits 0. The issue is the signal — see SKILL.md "Audit wiring".
