# Standalone secret scan. Language/framework-neutral — gitleaks reads raw bytes.
#
# Use when:
#   - You can't adopt the full reusable `_ci.yml` yet
#   - You want secret-scan as a separate required check (independent failure surface)
#   - You want secret-scan on every push, not just PRs (catches direct-pushes to a branch)
#
# Replace every `<sha>` with a 40-char commit SHA before use.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha>
        with:
          fetch-depth: 0  # gitleaks needs full history for diff scan

      - uses: gitleaks/gitleaks-action@<sha>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tune via `.gitleaks.toml` in repo root if defaults are noisy.
          # Common allowlist patterns: test fixtures, example .env files.
          # Do NOT add real secrets to the allowlist — rotate them instead.

      # Recommended companion (configure once, GitHub-side, not here):
      #   GitHub → Repo Settings → Code security & analysis → Secret scanning → Push protection: ON
      # Push protection rejects pushes that contain detected secrets BEFORE they hit the
      # remote — this workflow catches anything that slips past it. Layered defence.
